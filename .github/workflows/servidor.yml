# Servidor da versão Plus no Linux, como ele roda em produção: testes, a imagem Docker da API
# e o docker-compose do deploy. Não publica nada (a imagem é construída no próprio servidor).
name: Servidor

on:
  push:
    branches: [main]
    paths:
      - "src/DinoTranslator.Server/**"
      - "src/DinoTranslator.Shared/**"
      - "tests/DinoTranslator.Server.Tests/**"
      - "deploy/**"
      - "Directory.*.props"
      - "global.json"
      - ".github/workflows/servidor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  servidor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Testes do servidor
        run: dotnet test tests/DinoTranslator.Server.Tests -c Release -nologo

      - name: Imagem da API
        run: docker build -f deploy/Dockerfile -t dinotranslator-api .

      - name: Compose do deploy
        run: |
          cp deploy/.env.exemplo deploy/.env
          sed -i 's/^JWT_SIGNING_KEY=$/JWT_SIGNING_KEY=dGVzdGU=/; s/^LIVEKIT_API_SECRET=$/LIVEKIT_API_SECRET=segredo-de-teste-com-mais-de-32-caracteres/' deploy/.env
          docker compose -f deploy/docker-compose.yml config -q
