# Versão Plus num servidor (VPS Linux com Docker). Passo a passo em docs/DEPLOY.md.
#   cd deploy && sh gerar-env.sh && docker compose up -d --build
#
# Só o Caddy (HTTPS automático) e as portas de mídia do LiveKit ficam abertos para a internet;
# banco e Redis ficam na rede interna, com senha. A API roda em várias réplicas sem estado.

name: dinotranslator

x-api-ambiente: &api-ambiente
  ConnectionStrings__Database: "Host=postgres;Database=dinotranslator;Username=dinotranslator;Password=${POSTGRES_PASSWORD:?};Maximum Pool Size=50"
  Redis__Configuration: "redis:6379,password=${REDIS_PASSWORD:?}"
  Jwt__SigningKey: "${JWT_SIGNING_KEY:?}"
  ReverseProxy__KnownNetworks__0: "172.30.0.0/24"
  Auth__OpenRegistration: "${CADASTRO_ABERTO:-true}"
  Auth__RegistrationCode: "${CODIGO_CADASTRO:-}"
  LiveKit__Url: "wss://${DOMINIO_MIDIA:?}"
  LiveKit__ApiKey: "${LIVEKIT_API_KEY:?}"
  LiveKit__ApiSecret: "${LIVEKIT_API_SECRET:?}"

services:
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMINIO_API: "${DOMINIO_API:?}"
      DOMINIO_MIDIA: "${DOMINIO_MIDIA:?}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - livekit

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: dinotranslator-api
    restart: unless-stopped
    environment: *api-ambiente
    deploy:
      # Mais réplicas = mais conexões e mensagens por segundo; o Caddy reparte entre elas.
      replicas: ${API_REPLICAS:-2}
      resources:
        limits:
          memory: 1g
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: dinotranslator
      POSTGRES_USER: dinotranslator
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?}"
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=512MB"]
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dinotranslator -d dinotranslator"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?}"

  # Servidor de mídia das chamadas em grupo (SFU). Com Redis, dá para ligar mais nós depois.
  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
        redis:
          address: redis:6379
          password: "${REDIS_PASSWORD:?}"
        keys:
          ${LIVEKIT_API_KEY:?}: ${LIVEKIT_API_SECRET:?}
        webhook:
          api_key: ${LIVEKIT_API_KEY:?}
          urls:
            - http://api:8080/api/livekit/webhook
        logging:
          level: info
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"
    depends_on:
      redis:
        condition: service_healthy

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  redis-data:
